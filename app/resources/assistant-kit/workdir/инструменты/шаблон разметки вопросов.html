<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разметка вопросов</title>
<style>
:root { --bg:#f4f3ef; --card:#fff; --ink:#1d1c1a; --muted:#77736a; --line:#e3e0d8; --accent:#3b5bdb; --good:#2f9e44; --bad:#e03131; --warn:#e8590c; --chip:#eeece6; --sel:#3b5bdb22; }
@media (prefers-color-scheme: dark) { :root { --bg:#141413; --card:#1f1e1c; --ink:#ecebe7; --muted:#9c998f; --line:#33312d; --accent:#748ffc; --good:#51cf66; --bad:#ff6b6b; --warn:#ff922b; --chip:#2a2926; --sel:#748ffc2e; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
header { position:sticky; top:0; z-index:3; background:var(--bg); border-bottom:1px solid var(--line); }
.bar { max-width:1100px; margin:0 auto; padding:10px 16px 8px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.bar h1 { font-size:16px; margin:0; flex:1 1 auto; }
.btn { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:7px 12px; font:inherit; font-size:14px; cursor:pointer; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.themes { max-width:1100px; margin:0 auto; padding:0 16px 10px; display:flex; gap:6px; flex-wrap:wrap; }
.tb { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:4px 10px; font:inherit; font-size:13px; cursor:pointer; display:flex; gap:6px; align-items:center; }
.tb.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.tb .c { font-variant-numeric:tabular-nums; opacity:.75; } .tb .c.ok { color:var(--good); opacity:1; } .tb .c.over { color:var(--warn); opacity:1; } .tb.on .c.ok { color:#8ce99a; }
main { max-width:1100px; margin:0 auto; padding:18px 16px 80px; }
.thead { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
.thead h2 { margin:0; font-size:24px; } .muted { color:var(--muted); font-size:13px; }
.count { margin-left:auto; font-size:15px; font-weight:600; } .count.ok { color:var(--good); } .count.over { color:var(--warn); }
.tnote { font-size:13px; background:var(--chip); border-radius:8px; padding:7px 11px; margin:6px 0 12px; }
.list { display:flex; flex-direction:column; gap:6px; }
.row { background:var(--card); border:1px solid var(--line); border-radius:10px; }
.row.sel { outline:2px solid var(--accent); outline-offset:-1px; background:linear-gradient(var(--sel),var(--sel)),var(--card); }
.row.take { border-left:5px solid var(--good); } .row.no { border-left:5px solid var(--bad); opacity:.62; }
.main { display:grid; grid-template-columns:64px 1fr 1fr auto; gap:12px; align-items:center; padding:9px 12px; cursor:pointer; }
.price { font-weight:700; font-variant-numeric:tabular-nums; }
.qt { min-width:0; } .qt .img { color:var(--muted); font-size:13px; } .qt .txt { overflow-wrap:anywhere; }
.ans { font-weight:600; overflow-wrap:anywhere; } .ans .acc { font-weight:400; color:var(--muted); font-size:13px; }
.acts { display:flex; gap:6px; }
.ab { width:38px; height:34px; border-radius:8px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); font-size:16px; cursor:pointer; }
.ab.y.on { background:var(--good); border-color:var(--good); color:#fff; } .ab.n.on { background:var(--bad); border-color:var(--bad); color:#fff; }
.ab.e.on { background:var(--chip); }
.tags { display:flex; gap:4px; flex-wrap:wrap; padding:0 12px 8px 88px; } .tags:empty { display:none; }
.tag { font-size:12px; background:var(--warn); color:#fff; border-radius:999px; padding:1px 8px; } .tag.pf { background:var(--accent); } .tag.nt { background:var(--chip); color:var(--ink); }
.tag.dup { background:var(--bad); } .tag.dup.soft { background:var(--warn); } .tag.dup a { color:#fff; text-decoration:underline; }
.edit { border-top:1px dashed var(--line); padding:10px 12px 12px; display:grid; grid-template-columns:110px 1fr; gap:6px 10px; align-items:center; }
.edit label { color:var(--muted); font-size:13px; }
.f { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:6px 9px; font:inherit; font-size:14px; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { border:1px solid var(--line); background:var(--chip); color:var(--ink); border-radius:999px; padding:3px 10px; font:inherit; font-size:13px; cursor:pointer; }
.chip.on { background:var(--warn); border-color:var(--warn); color:#fff; } .chip.pf.on { background:var(--accent); border-color:var(--accent); }
kbd { font:11px ui-monospace,monospace; border:1px solid var(--line); border-radius:4px; padding:0 4px; margin-left:3px; opacity:.75; }
.own { margin-top:14px; } .own summary { cursor:pointer; color:var(--accent); font-size:14px; }
.own .edit { border:1px solid var(--line); border-radius:10px; background:var(--card); margin-top:8px; }
.help { position:fixed; bottom:0; left:0; right:0; background:var(--bg); border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); padding:7px 16px; text-align:center; }
.nav { display:flex; justify-content:space-between; margin-top:16px; }
.toast { position:fixed; bottom:44px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
.toast.on { opacity:1; }
@media (max-width:720px) { .main { grid-template-columns:52px 1fr auto; } .ans { grid-column:2/3; } .tags { padding-left:12px; } .edit { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="title">Разметка вопросов</h1>
    <button class="btn primary" id="copy">📋 Для Ye!Studio</button>
    <button class="btn" id="export">Сохранить отзывы</button>
  </div>
  <div class="themes" id="themes"></div>
</header>
<main>
  <div class="thead"><h2 id="tname"></h2><span class="muted" id="tmeta"></span><span class="count" id="count"></span></div>
  <div class="tnote" id="tnote"></div>
  <div class="list" id="list"></div>
  <details class="own" id="own"><summary>+ Свой вопрос в эту тему</summary>
    <div class="edit">
      <label>Цена</label><input class="f" id="o-price" type="number" step="100" style="width:110px">
      <label>Вопрос</label><input class="f" id="o-text">
      <label>🖼 в вопросе</label><input class="f" id="o-image" placeholder="запрос для Яндекс.Картинок">
      <label>Ответ</label><input class="f" id="o-answer">
      <label>🖼 в ответе</label><input class="f" id="o-answerImage">
      <span></span><div><button class="btn primary" id="o-add">Добавить</button> <span class="muted" id="o-msg"></span></div>
    </div>
  </details>
  <div class="nav"><button class="btn" id="prevT">← Предыдущая тема</button><button class="btn" id="nextT">Следующая тема →</button></div>
</main>
<div class="help"><kbd>↑</kbd><kbd>↓</kbd> вопрос · <kbd>1</kbd> беру · <kbd>0</kbd> нет · <kbd>Q</kbd>–<kbd>Y</kbd> причины · <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> цена · <kbd>Enter</kbd> править · <kbd>←</kbd><kbd>→</kbd> темы · <kbd>Esc</kbd> выйти из поля</div>
<div class="toast" id="toast"></div>
<script>
const DATA = /*DATA*/null;
const KEY = "q-labels-v1:" + DATA.batch;
const REASONS = [["boring","Скучно","q"],["wording","Кривая формулировка","w"],["ambiguous","Неоднозначный","e"],["wrong","Факт неверен","r"],["hint","Ответ подсказан","t"],["media","Трудно с медиа","y"]];
const PFS = [["cheaper","Дешевле","a"],["ok","В самый раз","s"],["pricier","Дороже","d"]];
let state = { labels:{}, edits:{}, own:[], theme:0, sel:0, open:{} };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) state = Object.assign(state, s); } catch (e) {}
state.open = state.open || {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const TH = DATA.themes;
const PRE = {}; DATA.themes.forEach(t => t.questions.forEach(q => PRE[q.id] = q.pre === true ? true : null));
const lab = id => state.labels[id] || (state.labels[id] = { take:PRE[id] ?? null, reasons:[], pf:"", note:"" });
const val = (q, k) => (state.edits[q.id] && k in state.edits[q.id]) ? state.edits[q.id][k] : q[k];
const setEdit = (q, k, v) => { (state.edits[q.id] = state.edits[q.id] || {})[k] = v; save(); };
const ownOf = t => state.own.filter(o => o.theme === t.id);
const rowsOf = t => t.questions.concat(ownOf(t).map(o => Object.assign({ isOwn:true }, o)));
const takenN = t => t.questions.filter(q => lab(q.id).take === true).length + ownOf(t).length;
$("title").textContent = "Разметка вопросов · " + DATA.pack;

function renderTabs() {
  $("themes").innerHTML = TH.map((t, i) => { const n = takenN(t);
    return `<button class="tb ${i === state.theme ? "on" : ""}" data-i="${i}">${esc(t.name)}<span class="c ${n === 7 ? "ok" : n > 7 ? "over" : ""}">${n}/7</span></button>`; }).join("");
}
// q.dup — пометка «проверить повторы.py»: где на FirePacks такое уже было (самые ранние паки первыми)
const DUP = { exact:"🔁 дословно было", media:"🔁 тот же файл был", answer:"🔁 тот же ответ был" };
function dupTag(q) {
  const d = q.dup; if (!d || !d.where || !d.where.length) return "";
  const w = d.where[0], more = d.total > 1 ? ` и ещё ${d.total - 1}` : "";
  return `<span class="tag dup ${d.kind === "answer" ? "soft" : ""}">${DUP[d.kind] || "🔁 было"}: <a href="${esc(w.url)}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">«${esc(w.name)}»</a>${w.theme ? " / " + esc(w.theme) : ""}${w.price != null ? " / " + esc(w.price) : ""}${more}</span>`;
}
function rowHtml(q, i) {
  const l = q.isOwn ? { take:true, reasons:[], pf:"", note:"" } : lab(q.id);
  const img = val(q, "image"), txt = val(q, "text"), acc = (val(q, "accept") || []).join(", ");
  const cls = ["row", i === state.sel ? "sel" : "", l.take === true ? "take" : l.take === false ? "no" : ""].join(" ");
  const tags = l.reasons.map(r => `<span class="tag">${esc((REASONS.find(x => x[0] === r) || [r, r])[1])}</span>`).join("")
    + (l.pf ? `<span class="tag pf">${esc(PFS.find(p => p[0] === l.pf)[1])}</span>` : "") + (l.note ? `<span class="tag nt">💬 ${esc(l.note)}</span>` : "") + (q.isOwn ? `<span class="tag nt">✍ своё</span>` : "") + (!q.isOwn && DATA.showNew && q.pre !== true ? `<span class="tag pf">новое</span>` : "") + dupTag(q);
  let edit = "";
  if (state.open[q.id] && !q.isOwn) edit = `<div class="edit" data-q="${q.id}">
    <label>Цена</label><input class="f" data-k="price" type="number" step="100" style="width:110px" value="${esc(val(q,"price"))}">
    <label>Вопрос</label><input class="f" data-k="text" value="${esc(txt)}">
    <label>🖼 в вопросе</label><input class="f" data-k="image" value="${esc(img)}" placeholder="запрос для Яндекс.Картинок">
    <label>Ответ</label><input class="f" data-k="answer" value="${esc(val(q,"answer"))}">
    <label>Ещё засчитать</label><input class="f" data-k="accept" value="${esc((val(q,"accept") || []).join("; "))}" placeholder="через ;">
    <label>🖼 в ответе</label><input class="f" data-k="answerImage" value="${esc(val(q,"answerImage"))}">
    <label>Причины</label><div class="chips">${REASONS.map(([id, n, k]) => `<button class="chip ${l.reasons.includes(id) ? "on" : ""}" data-r="${id}">${n}<kbd>${k.toUpperCase()}</kbd></button>`).join("")}</div>
    <label>Цена по ощущению</label><div class="chips">${PFS.map(([id, n, k]) => `<button class="chip pf ${l.pf === id ? "on" : ""}" data-pf="${id}">${n}<kbd>${k.toUpperCase()}</kbd></button>`).join("")}</div>
    <label>Комментарий</label><input class="f" data-k="__note" value="${esc(l.note)}">
  </div>`;
  return `<div class="${cls}" data-i="${i}">
    <div class="main">
      <div class="price">${esc(val(q,"price"))}</div>
      <div class="qt">${txt ? `<div class="txt">${esc(txt)}</div>` : ""}${img ? `<div class="img">🖼 ${esc(img)}</div>` : ""}${q.options ? `<div class="img">варианты: ${esc(q.options.join(" / "))}</div>` : ""}</div>
      <div class="ans">${esc(val(q,"answer"))}${acc ? ` <span class="acc">· ещё: ${esc(acc)}</span>` : ""}</div>
      <div class="acts">${q.isOwn ? `<button class="ab n" data-del="${q.id}" title="Удалить">🗑</button>` :
        `<button class="ab y ${l.take === true ? "on" : ""}" data-a="y" title="Беру (1)">✓</button><button class="ab n ${l.take === false ? "on" : ""}" data-a="n" title="Нет (0)">✕</button><button class="ab e ${state.open[q.id] ? "on" : ""}" data-a="e" title="Править (Enter)">✎</button>`}</div>
    </div>
    <div class="tags">${tags}</div>${edit}</div>`;
}
function render() {
  state.theme = Math.max(0, Math.min(state.theme, TH.length - 1));
  const t = TH[state.theme], rows = rowsOf(t);
  state.sel = Math.max(0, Math.min(state.sel, rows.length - 1));
  $("tname").textContent = t.name; $("tmeta").textContent = `раунд ${t.round} · ${t.comment || ""}`;
  $("tnote").textContent = t.note ? "ℹ " + t.note : ""; $("tnote").style.display = t.note ? "" : "none";
  const n = takenN(t); $("count").textContent = `взято ${n} из 7`; $("count").className = "count " + (n === 7 ? "ok" : n > 7 ? "over" : "");
  $("list").innerHTML = rows.map(rowHtml).join("");
  renderTabs(); save();
}
const cur = () => rowsOf(TH[state.theme])[state.sel];
function setTake(v) { const q = cur(); if (!q || q.isOwn) return; const l = lab(q.id); l.take = l.take === v ? null : v; if (v) l.reasons = [];
  if (l.take !== null) { const rows = rowsOf(TH[state.theme]); for (let k = state.sel + 1; k < rows.length; k++) if (!rows[k].isOwn && lab(rows[k].id).take === null) { state.sel = k; break; } }
  render(); }
function toggleR(id) { const q = cur(); if (!q || q.isOwn) return; const l = lab(q.id); l.reasons = l.reasons.includes(id) ? l.reasons.filter(x => x !== id) : l.reasons.concat(id); if (l.reasons.length && l.take === null) l.take = false; render(); }
function setPf(id) { const q = cur(); if (!q || q.isOwn) return; const l = lab(q.id); l.pf = l.pf === id ? "" : id; render(); }
function goTheme(d) { state.theme = (state.theme + d + TH.length) % TH.length; state.sel = 0; render(); window.scrollTo(0, 0); }

$("list").addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const i = +row.dataset.i; state.sel = i; const q = cur();
  const a = e.target.closest("[data-a]"), r = e.target.closest("[data-r]"), pf = e.target.closest("[data-pf]"), del = e.target.closest("[data-del]");
  if (del) { state.own = state.own.filter(o => o.id !== del.dataset.del); return render(); }
  if (a) { if (a.dataset.a === "y") return setTake(true); if (a.dataset.a === "n") return setTake(false); state.open[q.id] = !state.open[q.id]; return render(); }
  if (r) return toggleR(r.dataset.r); if (pf) return setPf(pf.dataset.pf);
  if (e.target.closest(".edit")) return;
  render();
});
$("list").addEventListener("input", e => {
  const f = e.target.closest("[data-k]"); if (!f) return; const q = rowsOf(TH[state.theme]).find(x => x.id === f.closest(".edit").dataset.q);
  const k = f.dataset.k;
  if (k === "__note") { lab(q.id).note = f.value; save(); return; }
  setEdit(q, k, k === "price" ? +f.value : k === "accept" ? f.value.split(";").map(s => s.trim()).filter(Boolean) : f.value);
});
$("list").addEventListener("focusout", e => { if (e.target.closest("[data-k]")) setTimeout(() => { if (!document.activeElement.closest || !document.activeElement.closest(".edit")) render(); }, 0); });
$("themes").onclick = e => { const b = e.target.closest(".tb"); if (!b) return; state.theme = +b.dataset.i; state.sel = 0; render(); };
$("prevT").onclick = () => goTheme(-1); $("nextT").onclick = () => goTheme(1);
document.addEventListener("keydown", e => {
  if (["TEXTAREA","INPUT","SELECT"].includes(e.target.tagName)) { if (e.key === "Escape") e.target.blur(); return; }
  const k = e.key.toLowerCase(), rows = rowsOf(TH[state.theme]);
  const r = REASONS.find((x, i) => x[2] === k || "йцукен"[i] === k), p = PFS.find((x, i) => x[2] === k || "фыв"[i] === k);
  if (k === "arrowdown") { e.preventDefault(); state.sel = Math.min(state.sel + 1, rows.length - 1); render(); document.querySelector(".row.sel")?.scrollIntoView({ block:"nearest" }); }
  else if (k === "arrowup") { e.preventDefault(); state.sel = Math.max(state.sel - 1, 0); render(); document.querySelector(".row.sel")?.scrollIntoView({ block:"nearest" }); }
  else if (k === "arrowright") goTheme(1); else if (k === "arrowleft") goTheme(-1);
  else if (k === "1") setTake(true); else if (k === "0") setTake(false);
  else if (k === "enter") { const q = cur(); if (q && !q.isOwn) { state.open[q.id] = !state.open[q.id]; render(); } }
  else if (r) toggleR(r[0]); else if (p) setPf(p[0]);
});
$("o-add").onclick = () => {
  const t = TH[state.theme];
  const o = { id:"own-" + Date.now().toString(36), theme:t.id, price:+$("o-price").value || 0, text:$("o-text").value.trim(), image:$("o-image").value.trim(), answer:$("o-answer").value.trim(), answerImage:$("o-answerImage").value.trim(), accept:[], options:null, type:"simple" };
  if (!o.answer) { $("o-msg").textContent = "Нужен ответ"; return; }
  state.own.push(o); ["o-price","o-text","o-image","o-answer","o-answerImage"].forEach(id => $(id).value = ""); $("o-msg").textContent = "Добавлено ✓"; render();
};
function forWorkshop() {
  const themes = TH.map(t => ({ round:t.round, name:t.name, comment:t.comment,
    questions: t.questions.filter(q => lab(q.id).take === true).concat(ownOf(t)).sort((a, b) => val(a,"price") - val(b,"price")).map(q => {
      const o = { price:+val(q,"price"), type:q.type || "simple", text:val(q,"text") || "" };
      if (val(q,"image")) o.image = val(q,"image"); o.answer = val(q,"answer"); if (val(q,"answerImage")) o.answerImage = val(q,"answerImage");
      o.accept = val(q,"accept") || []; o.options = q.options || null; return o; }) })).filter(t => t.questions.length);
  return { v:1, themes };
}
function toast(s) { $("toast").textContent = s; $("toast").classList.add("on"); setTimeout(() => $("toast").classList.remove("on"), 2600); }
$("copy").onclick = async () => {
  const js = forWorkshop(), n = js.themes.reduce((a, t) => a + t.questions.length, 0);
  if (!n) return toast("Пока ничего не взято");
  const txt = "```json\n" + JSON.stringify(js, null, 1) + "\n```";
  try { await navigator.clipboard.writeText(txt); } catch (e) { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast(`Скопировано ${n} вопр. — в Ye!Studio нажмите «Вставить из AI»`);
};
$("export").onclick = async () => {
  const out = { batch:DATA.batch, pack:DATA.pack, savedAt:new Date().toISOString(),
    decisions: TH.flatMap(t => t.questions.map(q => { const l = state.labels[q.id] || {}; return { id:q.id, theme:t.name, take:l.take ?? null,
      reasons:(l.reasons || []).map(r => (REASONS.find(x => x[0] === r) || [r, r])[1]), priceFeel:l.pf || "", note:l.note || "", edited:state.edits[q.id] || null }; })),
    own:state.own };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type:"application/json" }), name = "отзывы-" + DATA.batch + ".json";
  if (window.showSaveFilePicker) { try { const h = await showSaveFilePicker({ suggestedName:name, types:[{ description:"JSON", accept:{ "application/json":[".json"] } }] }); const w = await h.createWritable(); await w.write(blob); await w.close(); return; } catch (e) { if (e.name === "AbortError") return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
render();
</script>
</body>
</html>
