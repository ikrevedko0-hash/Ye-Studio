<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Ye!Studio</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { width: 840px; height: 473px; font-family: system-ui, "Segoe UI", sans-serif; }

  /* Плавное появление: fade + лёгкий scale, выключается вместе с остальной анимацией и на fade-out. */
  #stage {
    position: relative;
    width: 840px;
    height: 473px;
    border-radius: 14px;
    overflow: hidden;
    opacity: 0;
    transform: scale(1.03);
    animation: appear 600ms ease-out forwards;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  body.fade-out #stage {
    animation: none;
    transition: opacity 300ms ease-in;
    opacity: 0;
  }
  @keyframes appear {
    from { opacity: 0; transform: scale(1.03); }
    to { opacity: 1; transform: scale(1); }
  }

  #bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Сетка нейронов — canvas поверх правой верхней части картинки. */
  #net {
    position: absolute;
    top: 0;
    right: 0;
    width: 420px;
    height: 260px;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.85;
  }

  /* Блик по логотипу — градиентная маска, проходящая раз в ~2.5с. */
  #shine {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(
      100deg,
      rgba(255, 255, 255, 0) 40%,
      rgba(255, 255, 255, 0.22) 50%,
      rgba(255, 255, 255, 0) 60%
    );
    background-size: 300% 100%;
    background-position: 130% 0;
    animation: shine 2.5s ease-in-out infinite;
  }
  @keyframes shine {
    0%, 55% { background-position: 130% 0; }
    85%, 100% { background-position: -30% 0; }
  }

  /* Полоса загрузки: неопределённая анимация — «бегущий» градиентный отрезок. */
  #barTrack {
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: 34px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
  }
  #barFill {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 40%;
    border-radius: 2px;
    background: linear-gradient(90deg, #22d3ee, #3b82f6, #a855f7);
    animation: indeterminate 1.4s ease-in-out infinite;
  }
  @keyframes indeterminate {
    0% { left: -40%; }
    100% { left: 100%; }
  }

  #status {
    position: absolute;
    left: 24px;
    bottom: 14px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.78);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }

  #badge {
    position: absolute;
    top: 14px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  #badge .tag {
    padding: 2px 7px;
    border-radius: 999px;
    background: linear-gradient(90deg, #3b82f6, #a855f7);
    color: #fff;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  /* Отключить всю анимацию по системной настройке. */
  @media (prefers-reduced-motion: reduce) {
    #stage { animation: none; opacity: 1; transform: none; }
    body.fade-out #stage { transition: none; opacity: 0; }
    #shine { animation: none; opacity: 0; }
    #barFill { animation: none; left: 0; width: 100%; }
    #net { display: none; }
  }
</style>
</head>
<body>
  <div id="stage">
    <img id="bg" src="splash.webp" alt="" />
    <canvas id="net" width="420" height="260"></canvas>
    <div id="shine"></div>
    <div id="badge"><span class="tag">БЕТА</span><span id="ver"></span></div>
    <div id="barTrack"><div id="barFill"></div></div>
    <div id="status">Загрузка…</div>
  </div>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  document.getElementById("ver").textContent = params.get("v") || "";

  window.setStatus = function (text) {
    var el = document.getElementById("status");
    if (el) el.textContent = String(text);
  };

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduceMotion) return; // сеть узлов не нужна — canvas уже скрыт стилями

  // Сеть узлов: пульсирующие точки со связями, по ним бегут импульсы сине-фиолетового цвета.
  var canvas = document.getElementById("net");
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;
  var N = 16;
  var nodes = [];
  for (var i = 0; i < N; i++) {
    nodes.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.85,
      r: 1.6 + Math.random() * 1.6,
      phase: Math.random() * Math.PI * 2,
      speed: 0.6 + Math.random() * 0.6,
    });
  }
  // связи — только между близкими узлами, чтобы сетка не превращалась в кашу
  var links = [];
  for (var a = 0; a < N; a++) {
    for (var b = a + 1; b < N; b++) {
      var dx = nodes[a].x - nodes[b].x, dy = nodes[a].y - nodes[b].y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < 140) links.push({ a: a, b: b, d: d, offset: Math.random() });
    }
  }

  function lerpColor(t) {
    // #3b82f6 -> #a855f7
    var r = Math.round(59 + (168 - 59) * t);
    var g = Math.round(130 + (85 - 130) * t);
    var bch = Math.round(246 + (247 - 246) * t);
    return "rgba(" + r + "," + g + "," + bch + ",";
  }

  var t0 = performance.now();
  var raf = null;

  function frame(now) {
    var t = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);

    // линии + бегущие импульсы
    for (var i = 0; i < links.length; i++) {
      var L = links[i], A = nodes[L.a], B = nodes[L.b];
      var mid = (t * 0.15 + L.offset) % 1;
      var col = lerpColor(mid);
      ctx.strokeStyle = col + "0.16)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(A.x, A.y);
      ctx.lineTo(B.x, B.y);
      ctx.stroke();

      // импульс, бегущий по линии туда-обратно
      var p = (t * 0.35 + L.offset) % 1;
      var px = A.x + (B.x - A.x) * p;
      var py = A.y + (B.y - A.y) * p;
      ctx.fillStyle = lerpColor(p) + "0.9)";
      ctx.beginPath();
      ctx.arc(px, py, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }

    // узлы — пульсация радиуса и прозрачности
    for (var j = 0; j < N; j++) {
      var n = nodes[j];
      var pulse = 0.5 + 0.5 * Math.sin(t * n.speed + n.phase);
      ctx.fillStyle = lerpColor(pulse) + (0.35 + 0.45 * pulse) + ")";
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + pulse * 1.2, 0, Math.PI * 2);
      ctx.fill();
    }

    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
