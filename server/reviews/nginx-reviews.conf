# Страница отзывов по домену: nginx → 127.0.0.1:8787 (yestudio_server.py).
# DOMAIN — имя в punycode: уепак.рф = xn--80ajqss.xn--p1ai. Отдельный server-блок: сайт-маскировка VPN (rus-fake) не затрагивается,
# nginx выбирает блок по имени (SNI). Сертификат: certbot certonly --webroot -w /var/www/letsencrypt -d DOMAIN -d www.DOMAIN

server {
    listen 80;
    server_name DOMAIN www.DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://DOMAIN$request_uri; }
}

server {
    # без http2: в nginx 1.22 он включился бы для всего 443, в том числе для сайта-маскировки VPN
    listen 443 ssl;
    server_name DOMAIN www.DOMAIN;

    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host = www.DOMAIN) { return 301 https://DOMAIN$request_uri; }

    client_max_body_size 64k;
    # служебное приложение Ye!Studio (обновления, пинги, проверка повторов) по домену не отдаём
    location ~ ^/(updates/|api/(ping|control|errors|feedback|pack-index|pack-check)) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
